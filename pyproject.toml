[project]
name = "mainersql"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "click>=8.4.1",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=24.0.0",
    "pyodbc>=4",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.50",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[project.scripts]
mainersql = "cli:cli"

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (require Docker)",
]

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["cli*", "common*", "models*", "repository*", "tests*"]
exclude = ["iac*"]
